# Visitors can switch between light and dark in the app's Settings menu. It starts on their device's setting.
[theme]
font = "'Public Sans':https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap, sans-serif"
headingFont = "'Source Serif 4':https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap, serif"
baseRadius = "medium"

[theme.dark]
backgroundColor = "#171614"
secondaryBackgroundColor = "#21201D"
textColor = "#FAFAFA"
primaryColor = "#E9C46A"
borderColor = "#3A3733"
linkColor = "#E9C46A"

[theme.light]
backgroundColor = "#F6F7F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1B1D21"
primaryColor = "#7A5A10"
borderColor = "#DADDE3"
linkColor = "#7A5A10"

[server]
fileWatcherType = "poll"
