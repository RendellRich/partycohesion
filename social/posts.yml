# Posts that go out automatically to the PartyCohesion Facebook Page and Instagram account.
#
# The "Post to Facebook and Instagram" workflow checks this file every hour and posts each entry once its post_on date
# and time have come, once per network, one entry per run. Anyone can propose a post: add an entry in a pull request,
# and it goes out after the pull request is merged. An entry more than 7 days late is skipped; change post_on to
# send it. Member spotlights and the weekly finding card are added by scripts/schedule_posts.py, in a weekly pull
# request from the "Queue member spotlights" workflow.
#
#   id:        unique name for the post (never reuse one; social/posted.csv tracks what already went out)
#   card:      partycohesion, same-bill-different-vote, respect-for-marriage-act, senate-unity, floor-remarks, or
#              member/<Bioguide ID> for a member spotlight (its card and caption are in docs/social/members/)
#   post_on:   date to post (YYYY-MM-DD)
#   time:      optional, Eastern time in quotes ("19:35"); 09:00 if left out. Goes out on the first hourly run after it
#   expires_after_days: optional, how late it can still go out (7 by default; 1 for spotlights)
#   networks:  optional, [facebook, instagram] by default
#   caption:   optional; without it the card's caption from docs/social/captions.json is used. Facebook gets the
#              link; on Instagram, a line that is only a link becomes "Link in bio."
#
# Neutral wording only: describe the votes, don't judge them. No em dashes.

